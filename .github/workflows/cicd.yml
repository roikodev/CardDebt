name: Deploy React + Vite to Github Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CF_WORKER_ORIGIN: ${{ secrets.VITE_CF_WORKER_ORIGIN }}

      # Custom domain is served from site root; stale /CardDebt/ paths in index.html load no JS (blank page).
      - name: Verify index.html uses root asset paths
        run: |
          if grep -qF '/CardDebt/' dist/index.html; then
            echo "::error::dist/index.html still references /CardDebt/. For www.tcgcarddebt.com use vite base: '/' (see vite.config.ts)."
            exit 1
          fi

      - name: Deploy to github pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: www.tcgcarddebt.com
          force_orphan: true